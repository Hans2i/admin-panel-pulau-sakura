function makeTyper(cardId,skipId){
  var card=$(cardId),els=[],tm=0,I=0,N=0,user=false,i,list=card.querySelectorAll('h2,p,.sig');
  for(i=0;i<list.length;i++){
    var el=list[i];el._c=Array.from(el.textContent);
    el.innerHTML='<span class="tt"></span><i class="caret"></i><span class="tu"></span>';
    el._tt=el.children[0];el._cr=el.children[1];el._tu=el.children[2];els.push(el);
  }
  card.addEventListener('wheel',function(){user=true;},{passive:true});card.addEventListener('touchmove',function(){user=true;},{passive:true});
  card.addEventListener('click',function(e){if(!e.target.getAttribute('data-close'))finish();});
  function render(el,n){el._tt.textContent=el._c.slice(0,n).join('');el._tu.textContent=el._c.slice(n).join('');}
  function stop(){clearTimeout(tm);}
  function finish(){stop();els.forEach(function(el){render(el,el._c.length);el._cr.style.display='none';});I=els.length;$(skipId).style.visibility='hidden';}
  function step(){
    if(I>=els.length){finish();return;}
    var el=els[I];
    if(N===0){els.forEach(function(e){e._cr.style.display='none';});el._cr.style.display='inline-block';}
    N++;render(el,N);
    if(!user){var y=el._cr.offsetTop;if(y>card.scrollTop+card.clientHeight-80)card.scrollTop=y-card.clientHeight+120;}
    var ch=el._c[N-1],d=(I===0?60:40);
    if(ch===','||ch===';')d+=180;else if(ch==='.'||ch==='!'||ch==='?')d+=400;
    if(N>=el._c.length){I++;N=0;d+=600;}
    tm=setTimeout(step,d);
  }
  function start(){if(!card.parentNode.classList.contains('show'))return;stop();els.forEach(function(el){render(el,0);el._cr.style.display='none';});I=0;N=0;user=false;$(skipId).style.visibility='visible';card.scrollTop=0;step();}
  return {start:start,stop:stop,finish:finish};
}
